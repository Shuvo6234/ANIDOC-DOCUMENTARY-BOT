name: Utter Voice Test

# শুধু হাতে চালালে চলবে (schedule নেই), তাই আসল bot-এর সাথে কোনো সম্পর্ক নেই
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate 5 voice samples
        env:
          UTTER_API_KEY: ${{ secrets.UTTER_API_KEY }}
        run: |
          mkdir -p samples
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error

          key = os.environ.get("UTTER_API_KEY", "").strip()
          if not key:
              raise SystemExit("UTTER_API_KEY পাওয়া যায়নি (Secret-এর নাম ঠিক আছে কিনা দেখো)")

          TEXT = ("हज़ारों साल पहले, इस धरती पर एक ऐसी सभ्यता फली-फूली, जिसने इतिहास की दिशा बदल दी। "
                  "आज हम उसी रहस्यमयी दुनिया की यात्रा पर निकलते हैं।")
          VOICES = ["aria", "jason", "john", "leo", "sofia"]

          for v in VOICES:
              body = json.dumps({"text": TEXT, "language": "hi-IN", "voice": v, "format": "wav"}).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.utter.cc/v1/speech", data=body, method="POST",
                  headers={"Authorization": "Bearer " + key,
                           "Content-Type": "application/json",
                           "User-Agent": "anidoc-voice-test/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data = r.read()
                      rate = r.headers.get("X-Sample-Rate")
                      chars = r.headers.get("X-Characters")
                  open(f"samples/voice_{v}.wav", "wb").write(data)
                  print(f"OK  {v}: {len(data)} bytes, sample rate {rate}, characters {chars}")
              except urllib.error.HTTPError as e:
                  print(f"FAIL {v}: HTTP {e.code} {e.read().decode('utf-8', 'ignore')[:300]}")
              except Exception as e:
                  print(f"FAIL {v}: {type(e).__name__}: {str(e)[:200]}")
          PY
          ls -la samples

      - name: Save samples
        uses: actions/upload-artifact@v4
        with:
          name: utter-voice-samples
          if-no-files-found: error
          retention-days: 7
          path: samples/*.wav
