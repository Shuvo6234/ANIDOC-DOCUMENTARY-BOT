name: ANIDOC Hindi Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic (à¦«à¦¾à¦à¦•à¦¾ à¦°à¦¾à¦–à¦²à§‡ bot Google trending à¦¥à§‡à¦•à§‡ à¦¨à¦¿à¦œà§‡ à¦¬à¦¾à¦›à¦¬à§‡; folder-à¦ à¦†à¦—à§‡à¦° à¦•à¦¾à¦œ à¦šà¦²à¦²à§‡ topic à¦¬à§à¦¯à¦¬à¦¹à¦¾à¦° à¦¹à¦¬à§‡ à¦¨à¦¾)"
        required: false
        default: ""
  schedule:
    # à¦ªà§à¦°à¦¤à¦¿ à§§à§« à¦®à¦¿à¦¨à¦¿à¦Ÿà§‡; à¦¬à§à¦¯à¦¸à§à¦¤ à¦®à¦¿à¦¨à¦¿à¦Ÿ (0, 15, 30, 45) à¦à¦¡à¦¼à¦¾à¦¨à§‹ à¦¹à¦¯à¦¼à§‡à¦›à§‡, à¦¯à¦¾à¦¤à§‡ GitHub-à¦à¦° à¦¦à§‡à¦°à¦¿ à¦•à¦® à¦¹à¦¯à¦¼
    - cron: "7,22,37,52 * * * *"

# à¦à¦•à¦¸à¦¾à¦¥à§‡ à¦¦à§à¦Ÿà§‹ run à¦šà¦²à¦²à§‡ à¦à¦•à¦‡ à¦•à¦¾à¦œ à¦¦à§à¦¬à¦¾à¦° à¦¹à¦¯à¦¼à§‡ à¦¯à§‡à¦¤; à¦¤à¦¾à¦‡ à¦à¦•à¦Ÿà¦¾ à¦¶à§‡à¦· à¦¹à¦²à§‡ à¦¤à¦¬à§‡à¦‡ à¦ªà¦°à§‡à¦°à¦Ÿà¦¾ à¦¶à§à¦°à§
concurrency:
  group: anidoc
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          # screen text-à¦à¦° premium font (à¦¯à§‡à¦Ÿà¦¾ à¦ªà¦¾à¦“à¦¯à¦¼à¦¾ à¦¯à¦¾à¦¯à¦¼ à¦¨à¦¾ à¦¸à§‡à¦Ÿà¦¾ à¦¬à¦¾à¦¦, à¦¬à¦¾à¦•à¦¿à¦—à§à¦²à§‹ à¦ à¦¿à¦•à¦‡ à¦¬à¦¸à§‡)
          for p in fonts-montserrat fonts-playfair-display fonts-lato fonts-oswald fonts-liberation fonts-dejavu-core; do
            sudo apt-get install -y "$p" || true
          done

      - name: Run bot
        env:
          # à¦à¦•à¦Ÿà¦¾à¦‡ mode: à¦†à¦—à§‡ Drive folder à¦¦à§‡à¦–à§‡; zip+prompt à¦¥à¦¾à¦•à¦²à§‡ video à¦¬à¦¾à¦¨à¦¾à¦¯à¦¼, folder à¦«à¦¾à¦à¦•à¦¾ à¦¥à¦¾à¦•à¦²à§‡ à¦¨à¦¤à§à¦¨ prompt à¦¬à¦¾à¦¨à¦¾à¦¯à¦¼, à¦¨à¦‡à¦²à§‡ à¦•à¦¿à¦›à§ à¦¨à¦¾ à¦•à¦°à§‡ à¦¬à§‡à¦°à¦¿à¦¯à¦¼à§‡ à¦¯à¦¾à¦¯à¦¼
          MODE: "once"
          TOPIC: ${{ github.event.inputs.topic }}
          MAX_RUN_MIN: "345"
          POLL_SEC: "120"
          WATCH_MAX_MIN: "330"
          QUOTA_WAIT_MIN: "60"
          AUTO_TOPIC: "1"
          TREND_GEOS: "BD,PK,IN"
          ARCHIVE_FOLDER: "Finished_Videos"
          DIALOGUE_DETECT: "plan"
          DIALOGUE_MIN_SEC: "0.8"
          GEMINI_QUOTA_COOLDOWN_SEC: "60"
          GEMINI_TRANSIENT_COOLDOWN_SEC: "15"
          TEXT_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          TTS_MODELS: "gemini-3.8-flash-tts"
          FLOW_BATCH: "20"
          BLOCK_CHARS: "240"
          SCENE_CHARS: "60"
          VOICE_SPEED: "0.95"
          MAX_PAUSE: "0.18"
          MIN_PAUSE_RUN: "0.25"
          BGM_MOOD: "cinematic"
          BGM_VOL: "0.30"
          LUFS: "-14"
          # --- sound effects (0 à¦¦à¦¿à¦²à§‡ à¦¸à¦¬ à¦¬à¦¨à§à¦§) ---
          SFX: "1"
          SFX_VOL: "0.5"
          # --- à¦¨à¦¿à¦œà§‡à¦° sound library: Music_SFX_Library-à¦¤à§‡ sfx_*.wav/mp3, pack*.mp3 à¦¬à¦¾ Sounds folder à¦¥à¦¾à¦•à¦²à§‡ à¦¬à¦¸à¦¾à¦¯à¦¼ (0 = à¦¬à¦¨à§à¦§) ---
          SOUND_LIB: "1"
          LIB_SILENCE_DB: "-38,-32,-26,-20"
          # --- scene à¦¬à¦¦à¦²à§‡à¦° transition ---
          TRANSITION_SEC: "0.5"
          TRANSITION: "fade"
          # à¦¸à¦¾à¦§à¦¾à¦°à¦£ fade-à¦à¦° à¦•à¦¤ à¦…à¦‚à¦¶ (0.6 = à§¬à§¦%) premium style (dissolve/smooth/iris/wipe/reveal/push/graydip) à¦¹à¦¬à§‡; 0 = à¦¬à¦¨à§à¦§
          TRANSITION_MIX: "0.6"
          TRANS_SFX: "1"
          TRANS_SFX_VOL: "0.55"
          CLIP_AUDIO_VOL: "0.5"
          # --- à¦ªà¦°à§à¦¦à¦¾à¦¯à¦¼ premium style à¦‡à¦‚à¦°à§‡à¦œà¦¿ text (0 = à¦¬à¦¨à§à¦§) ---
          SCREEN_TEXT: "1"
          TEXT_SIZE: "58"
          # --- video à¦¶à§‡à¦·à§‡ à¦…à¦ªà§à¦°à¦¯à¦¼à§‹à¦œà¦¨à§€à¦¯à¦¼ à¦¸à¦¬ à¦¸à§à¦¥à¦¾à¦¯à¦¼à§€à¦­à¦¾à¦¬à§‡ à¦®à§‹à¦›à¦¾; Music_SFX_Library à¦•à¦–à¦¨à§‹ à¦®à§‹à¦›à¦¾ à¦¹à¦¯à¦¼ à¦¨à¦¾ (0 = à¦ªà¦°à¦¿à¦·à§à¦•à¦¾à¦° à¦¬à¦¨à§à¦§) ---
          CLEAN_AFTER_VIDEO: "1"
          # --- final video export: 2K (2560x1440)à¥¤ 0 à¦¦à¦¿à¦²à§‡ à¦†à¦—à§‡à¦° à¦®à¦¤à§‹ 1080p; à¦¸à¦®à¦¯à¦¼ à¦¬à§‡à¦¶à¦¿ à¦²à¦¾à¦—à¦²à§‡ OUT_PRESET veryfast à¦•à¦°à§‹ ---
          OUT_W: "2560"
          OUT_H: "1440"
          OUT_CRF: "18"
          OUT_PRESET: "fast"
          # --- title/description/tags txt à¦¯à¦¾à¦¬à§‡ Output-à¦à¦° à¦¬à¦¾à¦‡à¦°à§‡ à¦à¦‡ à¦à¦•à¦Ÿà¦¾ folder-à¦ (à¦ªà§à¦°à¦¥à¦®à¦¬à¦¾à¦° bot à¦¨à¦¿à¦œà§‡ à¦¬à¦¾à¦¨à¦¾à¦¬à§‡) ---
          PACKAGES_FOLDER: "Video_Packages"
          LIBRARY_FOLDER: "Music_SFX_Library"
          # --- YouTube: UniPost à¦¦à¦¿à¦¯à¦¼à§‡ à¦¸à¦°à¦¾à¦¸à¦°à¦¿ à¦†à¦ªà¦²à§‹à¦¡à¥¤ à¦¸à¦«à¦² à¦¹à¦²à§‡ Drive-à¦ à¦¥à¦¾à¦•à§‡ à¦¶à§à¦§à§ thumbnail prompt txt;
          #     à¦¬à§à¦¯à¦°à§à¦¥ à¦¹à¦²à§‡ final video à¦†à¦° youtube_package.txt Drive-à¦ à¦¯à¦¾à¦¯à¦¼ ---
          UNIPOST_API_KEY: ${{ secrets.UNIPOST_API_KEY }}
          UNIPOST_MODE: "publish"
          UNIPOST_PRIVACY: "unlisted"
          # --- Blogger: topic à¦¤à¦¾à¦²à¦¿à¦•à¦¾ à¦¶à§à¦§à§ Blogger-à¦à¦° draft page-à¦à¥¤ Blogger à¦¨à¦¾ à¦šà¦²à¦²à§‡ bot à¦¥à¦¾à¦®à§‡ à¦†à¦° à¦ªà¦°à§‡à¦° run à¦¨à¦¿à¦œà§‡ à¦†à¦¬à¦¾à¦° à¦šà§‡à¦·à§à¦Ÿà¦¾ à¦•à¦°à§‡ ---
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_WAIT_MIN: "10"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python bot.py

      - name: Save backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidoc-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            script.txt
            all_image_prompts.txt
            all_video_prompts.txt
            youtube_package.txt
            scenes.json
            image_map.json
