name: ANIDOC Hindi Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic (ফাঁকা রাখলে bot Google trending থেকে নিজে বাছবে; folder-এ আগের কাজ চললে topic ব্যবহার হবে না)"
        required: false
        default: ""
  schedule:
    # প্রতি ১৫ মিনিটে; ব্যস্ত মিনিট (0, 15, 30, 45) এড়ানো হয়েছে, যাতে GitHub-এর দেরি কম হয়
    - cron: "7,22,37,52 * * * *"

# একসাথে দুটো run চললে একই কাজ দুবার হয়ে যেত; তাই একটা শেষ হলে তবেই পরেরটা শুরু
concurrency:
  group: anidoc
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          # screen text-এর premium font (যেটা পাওয়া যায় না সেটা বাদ, বাকিগুলো ঠিকই বসে)
          for p in fonts-montserrat fonts-playfair-display fonts-lato fonts-oswald fonts-liberation fonts-dejavu-core; do
            sudo apt-get install -y "$p" || true
          done

      - name: Run bot
        env:
          # একটাই mode: আগে Drive folder দেখে; zip+prompt থাকলে video বানায়, folder ফাঁকা থাকলে নতুন prompt বানায়, নইলে কিছু না করে বেরিয়ে যায়
          MODE: "once"
          TOPIC: ${{ github.event.inputs.topic }}
          MAX_RUN_MIN: "345"
          POLL_SEC: "120"
          WATCH_MAX_MIN: "330"
          QUOTA_WAIT_MIN: "60"
          AUTO_TOPIC: "1"
          TREND_GEOS: "BD,PK,IN"
          ARCHIVE_FOLDER: "Finished_Videos"
          DIALOGUE_DETECT: "plan"
          DIALOGUE_MIN_SEC: "0.8"
          GEMINI_QUOTA_COOLDOWN_SEC: "60"
          GEMINI_TRANSIENT_COOLDOWN_SEC: "15"
          TEXT_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          TTS_MODELS: "gemini-3.8-flash-tts"
          FLOW_BATCH: "20"
          BLOCK_CHARS: "240"
          SCENE_CHARS: "60"
          VOICE_SPEED: "0.95"
          MAX_PAUSE: "0.18"
          MIN_PAUSE_RUN: "0.25"
          BGM_MOOD: "cinematic"
          BGM_VOL: "0.30"
          LUFS: "-14"
          # --- sound effects (0 দিলে সব বন্ধ) ---
          SFX: "1"
          SFX_VOL: "0.5"
          # --- নিজের sound library: Music_SFX_Library-তে sfx_*.wav/mp3, pack*.mp3 বা Sounds folder থাকলে বসায় (0 = বন্ধ) ---
          SOUND_LIB: "1"
          LIB_SILENCE_DB: "-38,-32,-26,-20"
          # --- scene বদলের transition ---
          TRANSITION_SEC: "0.5"
          TRANSITION: "fade"
          # সাধারণ fade-এর কত অংশ (0.6 = ৬০%) premium style (dissolve/smooth/iris/wipe/reveal/push/graydip) হবে; 0 = বন্ধ
          TRANSITION_MIX: "0.6"
          TRANS_SFX: "1"
          TRANS_SFX_VOL: "0.55"
          CLIP_AUDIO_VOL: "0.5"
          # --- পর্দায় premium style ইংরেজি text (0 = বন্ধ) ---
          SCREEN_TEXT: "1"
          TEXT_SIZE: "58"
          # --- video শেষে final mp4 + youtube_package.txt ছাড়া সব স্থায়ীভাবে মোছা; Music_SFX_Library কখনো মোছা হয় না ---
          CLEAN_AFTER_VIDEO: "1"
          KEEP_YT_PACKAGE: "1"
          LIBRARY_FOLDER: "Music_SFX_Library"
          # --- Blogger: topic তালিকা শুধু Blogger-এর draft page-এ। Blogger না চললে bot থামে আর পরের run নিজে আবার চেষ্টা করে ---
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_WAIT_MIN: "10"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python bot.py

      - name: Save backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidoc-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            script.txt
            all_image_prompts.txt
            all_video_prompts.txt
            youtube_package.txt
            scenes.json
            image_map.json
