name: ANIDOC Hindi Documentary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = প্রতি 2 মিনিটে folder দেখে zip পেলে video বানায় | prompts = script + scene prompt | video = একবার চালাও"
        type: choice
        options:
          - watch
          - prompts
          - video
        default: watch
      topic:
        description: "Documentary topic (prompts mode-এ; ফাঁকা রাখলে Google trending থেকে bot নিজে বাছবে)"
        required: false
  # watcher প্রতি ৬ ঘণ্টায় নিজে আবার চালু হয় (একটা শেষ হলে পরেরটা শুরু)
  schedule:
    - cron: "0 */6 * * *"

# একই mode একসাথে দুইবার চলবে না; prompts আর watch আলাদা group, তাই একসাথে চলতে পারে
concurrency:
  group: anidoc-${{ github.event.inputs.mode || 'watch' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write   # watcher শেষ হলে নিজেই নতুন watcher চালু করার জন্য
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run bot
        env:
          MODE: ${{ github.event.inputs.mode || 'watch' }}
          TOPIC: ${{ github.event.inputs.topic }}
          MAX_RUN_MIN: "345"
          # --- watch ---
          POLL_SEC: "120"
          WATCH_MAX_MIN: "330"
          QUOTA_WAIT_MIN: "60"
          # --- auto topic: video শেষ হলে mp4 archive করে trending topic-এর নতুন prompt পাঠায় (0 = বন্ধ) ---
          AUTO_TOPIC: "1"
          TREND_GEO: "IN"
          ARCHIVE_FOLDER: "Finished_Videos"
          # --- dialogue clip ধরা (plan = শুধু dialogue plan করা scene-এ) ---
          DIALOGUE_DETECT: "plan"
          DIALOGUE_MIN_SEC: "0.8"
          GEMINI_QUOTA_COOLDOWN_SEC: "60"
          GEMINI_TRANSIENT_COOLDOWN_SEC: "15"
          TEXT_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          TTS_MODELS: "gemini-3.8-flash-tts"
          # --- sync ---
          BLOCK_CHARS: "240"
          SCENE_CHARS: "60"
          # --- voice ---
          VOICE_SPEED: "0.95"
          MAX_PAUSE: "0.18"
          MIN_PAUSE_RUN: "0.25"
          # --- audio mix ---
          BGM_MOOD: "cinematic"
          BGM_VOL: "0.30"
          LUFS: "-14"
          # --- sound effects (0 দিলে বন্ধ) ---
          SFX: "1"
          SFX_VOL: "0.5"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python bot.py

      - name: Save backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidoc-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            script.txt
            all_prompts.txt
            youtube_package.txt
            scenes.json
            image_map.json

      # watcher (৫.৫ ঘণ্টা) স্বাভাবিকভাবে শেষ হলে সঙ্গে সঙ্গে নতুন watcher চালু করে।
      # (GitHub-এর একটা job সর্বোচ্চ ৬ ঘণ্টা চলে, তাই ৩০ মিনিট হাতে রেখে বদলি শুরু হয়)
      - name: Restart watcher
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'watch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f mode=watch
