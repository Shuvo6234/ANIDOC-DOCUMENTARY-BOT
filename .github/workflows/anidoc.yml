name: ANIDOC Hindi Documentary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = একবার folder দেখে কাজ থাকলে করে (cron-এর মতো) | prompts = script + prompt | video = zip থাকলে video বানাও"
        type: choice
        options:
          - once
          - prompts
          - video
        default: once
      topic:
        description: "Documentary topic (prompts mode-এ; ফাঁকা রাখলে Google trending থেকে bot নিজে বাছবে)"
        required: false
  # প্রতি ১৫ মিনিটে GitHub নিজে চালায়: folder-এ zip থাকলে video বানায়, video শেষ হলে নতুন prompt পাঠায়, কাজ না থাকলে সঙ্গে সঙ্গে বেরিয়ে যায়
  schedule:
    - cron: "*/15 * * * *"

# একই mode একসাথে দুইবার চলবে না (video বানাতে বেশি সময় লাগলে পরের cron অপেক্ষা করে, দুটো একসাথে চলে না)
concurrency:
  group: anidoc-${{ github.event.inputs.mode || 'once' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run bot
        env:
          MODE: ${{ github.event.inputs.mode || 'once' }}
          TOPIC: ${{ github.event.inputs.topic }}
          MAX_RUN_MIN: "345"
          # --- watch ---
          POLL_SEC: "120"
          WATCH_MAX_MIN: "330"
          QUOTA_WAIT_MIN: "60"
          # --- auto topic: video শেষ হলে mp4 archive করে trending topic-এর নতুন prompt পাঠায় (0 = বন্ধ) ---
          AUTO_TOPIC: "1"
          TREND_GEO: "IN"
          ARCHIVE_FOLDER: "Finished_Videos"
          # --- dialogue clip ধরা (plan = শুধু dialogue plan করা scene-এ) ---
          DIALOGUE_DETECT: "plan"
          DIALOGUE_MIN_SEC: "0.8"
          GEMINI_QUOTA_COOLDOWN_SEC: "60"
          GEMINI_TRANSIENT_COOLDOWN_SEC: "15"
          TEXT_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          TTS_MODELS: "gemini-3.8-flash-tts"
          # --- Flow agent এক বারে কত scene করবে (Flow limit 24, তাই 20) ---
          FLOW_BATCH: "20"
          # --- sync ---
          BLOCK_CHARS: "240"
          SCENE_CHARS: "60"
          # --- voice ---
          VOICE_SPEED: "0.95"
          MAX_PAUSE: "0.18"
          MIN_PAUSE_RUN: "0.25"
          # --- audio mix ---
          BGM_MOOD: "cinematic"
          BGM_VOL: "0.30"
          LUFS: "-14"
          # --- sound effects (0 দিলে বন্ধ) ---
          SFX: "1"
          SFX_VOL: "0.5"
          # --- scene বদলের transition (TRANSITION_SEC 0 দিলে বন্ধ; TRANSITION: fade | fadeblack | dissolve, comma দিয়ে পালা করেও দেওয়া যায়) ---
          TRANSITION_SEC: "0.5"
          TRANSITION: "fade"
          TRANS_SFX: "1"
          TRANS_SFX_VOL: "0.55"
          # --- Flow/Veo clip-এর নিজের sound (ambient/পায়ের শব্দ ইত্যাদি) narration-এর নিচে মেশানো (0 = বন্ধ) ---
          CLIP_AUDIO_VOL: "0.5"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python bot.py

      - name: Save backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidoc-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            script.txt
            all_image_prompts.txt
            all_video_prompts.txt
            youtube_package.txt
            scenes.json
            image_map.json
