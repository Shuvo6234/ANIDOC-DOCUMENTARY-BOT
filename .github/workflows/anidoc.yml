name: ANIDOC Hindi Documentary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = একবার folder দেখে কাজ থাকলে করে (cron-এর মতো) | prompts = script + prompt | video = zip থাকলে video বানাও"
        type: choice
        options:
          - once
          - prompts
          - video
        default: once
      topic:
        description: "Documentary topic (prompts mode-এ; ফাঁকা রাখলে Google trending থেকে bot নিজে বাছবে)"
        required: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: anidoc-${{ github.event.inputs.mode || 'once' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run bot
        env:
          MODE: ${{ github.event.inputs.mode || 'once' }}
          TOPIC: ${{ github.event.inputs.topic }}
          MAX_RUN_MIN: "345"
          POLL_SEC: "120"
          WATCH_MAX_MIN: "330"
          QUOTA_WAIT_MIN: "60"
          AUTO_TOPIC: "1"
          TREND_GEO: "IN"
          ARCHIVE_FOLDER: "Finished_Videos"
          DIALOGUE_DETECT: "plan"
          DIALOGUE_MIN_SEC: "0.8"
          GEMINI_QUOTA_COOLDOWN_SEC: "60"
          GEMINI_TRANSIENT_COOLDOWN_SEC: "15"
          TEXT_MODELS: "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
          TTS_MODELS: "gemini-3.8-flash-tts"
          FLOW_BATCH: "20"
          BLOCK_CHARS: "240"
          SCENE_CHARS: "60"
          VOICE_SPEED: "0.95"
          MAX_PAUSE: "0.18"
          MIN_PAUSE_RUN: "0.25"
          BGM_MOOD: "cinematic"
          BGM_VOL: "0.30"
          LUFS: "-14"
          # --- sound effects (0 দিলে সব বন্ধ) ---
          SFX: "1"
          SFX_VOL: "0.5"
          # --- নিজের sound library: Drive-এ pack*.mp3 বা Sounds folder থাকলে নিজে কেটে চিনে বসায় (0 = বন্ধ) ---
          SOUND_LIB: "1"
          LIB_SILENCE_DB: "-38,-32,-26,-20"
          # --- scene বদলের transition: scene-এ AI-র বাছা style (flash/zoom/blur/glitch/whip/fadeblack/dissolve/fade) ব্যবহার হয়;
          #     না থাকলে নিচের তালিকা পালা করে। TRANSITION_SEC 0 দিলে transition বন্ধ ---
          TRANSITION_SEC: "0.5"
          TRANSITION: "fade"
          TRANS_SFX: "1"
          TRANS_SFX_VOL: "0.55"
          CLIP_AUDIO_VOL: "0.5"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.OUTPUT_FOLDER_ID }}
        run: python bot.py

      - name: Save backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anidoc-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            script.txt
            all_image_prompts.txt
            all_video_prompts.txt
            youtube_package.txt
            scenes.json
            image_map.json
