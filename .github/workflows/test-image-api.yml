name: Test Image API

on:
  workflow_dispatch:
    inputs:
      request_count:
        description: "Number of image requests"
        required: true
        default: "20"
        type: string

      gap_seconds:
        description: "Delay between requests (seconds)"
        required: true
        default: "1"
        type: string

      prompt_field:
        description: "JSON prompt parameter name"
        required: true
        default: "prompt"
        type: string

      image_prompt:
        description: "Image generation prompt"
        required: true
        default: "A cinematic fantasy landscape with a small castle on a floating island, golden sunrise, detailed digital art"
        type: string

      api_endpoint:
        description: "API endpoint path"
        required: true
        default: "/api/genimage"
        type: string

permissions:
  contents: read

jobs:
  test-image-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Image API Test
        env:
          IMAGE_API_URL: https://apiimagestrax.vercel.app
          IMAGE_API_ENDPOINT: ${{ inputs.api_endpoint }}
          PROMPT_FIELD: ${{ inputs.prompt_field }}
          IMAGE_PROMPT: ${{ inputs.image_prompt }}
          REQUEST_COUNT: ${{ inputs.request_count }}
          GAP_SECONDS: ${{ inputs.gap_seconds }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}

        run: python test_image_api.py

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: |
            generated-images/
            test-results.json
          if-no-files-found: warn
          retention-days: 7
